<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤務表自動承認</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: sans-serif;
      font-size: 14px;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }

    #start-btn {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #start-btn:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      min-height: 20px;
      color: #333;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #status.error {
      color: #d93025;
    }

    #status.success {
      color: #188038;
    }
  </style>
</head>
<body>
  <h1>勤務表自動承認</h1>
  <button id="start-btn">承認処理開始</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
